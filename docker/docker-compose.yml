services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: linguanotebook
      POSTGRES_USER: linguanotebook
      POSTGRES_PASSWORD: linguanotebook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguanotebook"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://linguanotebook:linguanotebook@postgres:5432/linguanotebook
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=linguanotebook
      - STORAGE_USE_SSL=false
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
      - GPU_ENABLED=${GPU_ENABLED:-false}
      - SELF_HOSTED=${SELF_HOSTED:-false}
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_started

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=1
    environment:
      - DATABASE_URL=postgresql+asyncpg://linguanotebook:linguanotebook@postgres:5432/linguanotebook
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - STORAGE_ENDPOINT=minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=linguanotebook
      - STORAGE_USE_SSL=false
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
      - GPU_ENABLED=${GPU_ENABLED:-false}
      - SELF_HOSTED=${SELF_HOSTED:-false}
    volumes:
      - ../backend:/app
    depends_on:
      - redis
      - postgres
      - qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu
      - all

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A src.workers.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://linguanotebook:linguanotebook@postgres:5432/linguanotebook
      - SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - ../backend:/app
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    command: pnpm dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend-api

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
