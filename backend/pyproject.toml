[project]
name = "lingua-notebook-backend"
version = "1.0.0"
description = "LinguaNotebook — open-source language learning platform backend"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term --cov-fail-under=80"
